# IP HTTPS entry. Existing named virtual hosts continue to route by their names.
limit_req_zone $binary_remote_addr zone=voxel_requests:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=voxel_joins:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=voxel_connections:1m;

server {
    listen 80;
    server_name 140.143.163.231;
    return 302 https://140.143.163.231$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name 140.143.163.231;
    ssl_certificate /etc/voxel-kingdom/tls/server.crt;
    ssl_certificate_key /etc/voxel-kingdom/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VoxelTLS:1m;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn voxel_connections 24;
    access_log /var/log/nginx/voxel-kingdom.access.log;
    error_log /var/log/nginx/voxel-kingdom.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # The IP certificate is self-signed: do not set HSTS for this test deployment.
    root /opt/voxel-kingdom/client-current/build/client-web;
    gzip_static on;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location /ui/ {
        alias /opt/voxel-kingdom/client-current/client/web/;
        add_header Cache-Control "no-cache";
    }
    location /api/ {
        limit_req zone=voxel_requests burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
    location = /api/join {
        limit_req zone=voxel_joins burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ws {
        limit_req zone=voxel_requests burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
